name: Helix Weekly Master Build (Max Performance)

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fork master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Sync with upstream master
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/helix-editor/helix.git
          git fetch upstream master
          git rebase upstream/master
          git push --force-with-lease origin master

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # 安装打包工具、mold 极速链接器与 clang
      - name: Install System Dependencies & mold
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd makeself mold clang

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # 注入 mimalloc 内存分配器
      - name: Inject mimalloc allocator
        run: |
          cargo add mimalloc --package helix-term
          sed -i '1s/^/#[global_allocator]\nstatic GLOBAL: mimalloc::MiMalloc = mimalloc::MiMalloc;\n\n/' helix-term/src/main.rs

      # 编译：启用 mold + x86-64-v3 (AVX2/FMA/SIMD) + profile.opt (Fat LTO)
      - name: Build Helix (Max Optimized)
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v3"
        run: |
          mold -run cargo build \
            --profile opt \
            --locked \
            --package helix-term

      # 全量语法构建
      - name: Fetch and Build ALL Grammars
        run: |
          export HELIX_RUNTIME="$PWD/runtime"
          # 注意：--profile opt 编译产物在 target/opt/ 下
          ./target/opt/hx --grammar fetch
          ./target/opt/hx --grammar build

      # 打包归档与 makeself 单文件
      - name: Package Dist
        run: |
          strip target/opt/hx || true
          strip runtime/grammars/*.so || true
          rm -rf runtime/grammars/sources

          mkdir -p dist/helix
          cp target/opt/hx dist/helix/hx
          cp -r runtime dist/helix/runtime

          # 打包 tar.zst
          tar -C dist --zstd -cf "helix-master-x86_64-linux.tar.zst" helix

          # 打包 tar.gz
          tar -C dist -czf "helix-master-x86_64-linux.tar.gz" helix

          # 打包 makeself 纯单文件
          cat << 'EOF' > dist/helix/entrypoint.sh
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export HELIX_RUNTIME="$HERE/runtime"
          exec "$HERE/hx" "$@"
          EOF
          chmod +x dist/helix/entrypoint.sh

          makeself --target ~/.cache/helix-rolling \
                   dist/helix \
                   helix-master-x86_64-linux.run \
                   "Helix Master Standalone (mimalloc + v3)" \
                   ./entrypoint.sh

          sha256sum helix-master-x86_64-linux.tar.zst \
                    helix-master-x86_64-linux.tar.gz \
                    helix-master-x86_64-linux.run \
                    > SHA256SUMS

      - name: Publish Rolling Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: "Helix Master Rolling (${{ steps.sync.outputs.short }}) [Optimized]"
          body: |
            Automatically built from upstream `helix-editor/helix` master.
            - **Commit**: [${{ steps.sync.outputs.sha }}](https://github.com/helix-editor/helix/commit/${{ steps.sync.outputs.sha }})
            - **Optimizations**:
              - 🚀 Allocator: Embedded **`mimalloc`**
              - ⚡ Instructions: **`x86-64-v3`** (AVX2, FMA, BMI1/2 enabled)
              - 🔗 Linker: **`mold`** + **Fat LTO** (`--profile opt`)
              - 📚 Grammars: All 200+ languages pre-compiled.
          files: |
            helix-master-x86_64-linux.tar.zst
            helix-master-x86_64-linux.tar.gz
            helix-master-x86_64-linux.run
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}